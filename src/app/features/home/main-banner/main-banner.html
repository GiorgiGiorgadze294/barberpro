<section id="hero" class="banner-section">
  <div class="banner-overlay"></div>
  <div class="container banner-container">
    <div class="banner-content">
      <span class="badge">პრემიუმ ბარბერშოპი</span>
      <h1 class="title">სტილი, რომელიც <br><span class="gold-text">გამოგარჩევს</span></h1>
      <p class="description">
        პროფესიონალური თმის და წვერის მოვლა თბილისის ცენტრში. ენდეთ გამოცდილ ოსტატებს და მიიღეთ იდეალური შედეგი.
      </p>
      
      <div class="banner-actions">
        <button class="btn btn-primary" (click)="scrollTo('booking')">
          დაჯავშნე ვიზიტი
        </button>
        <button class="btn btn-outline" (click)="scrollTo('services')">
          სერვისები
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <h3>10+</h3>
          <p>წლიანი გამოცდილება</p>
        </div>
        <div class="stat-item">
          <h3>5k+</h3>
          <p>კმაყოფილი მომხმარებელი</p>
        </div>
        <div class="stat-item">
          <h3>4.9 ★</h3>
          <p>რეიტინგი</p>
        </div>
      </div>
    </div>
  </div>
</section>
