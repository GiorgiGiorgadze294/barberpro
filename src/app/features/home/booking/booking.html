<section id="booking" class="booking-section">
  <div class="container">
    <app-section-title 
      subtitle="ონლაინ ჯავშანი" 
      title="დაჯავშნეთ ვიზიტი" 
      [center]="true">
    </app-section-title>

    <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" class="booking-form">
      <div class="form-row">
        <div class="form-group">
          <label for="fullName">სრული სახელი</label>
          <input type="text" id="fullName" formControlName="fullName" placeholder="მაგ: გიორგი გიორგაძე">
        </div>

        <div class="form-group">
          <label for="phone">ტელეფონის ნომერი</label>
          <input type="tel" id="phone" formControlName="phone" placeholder="599XXXXXX">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="serviceId">სერვისი</label>
          <select id="serviceId" formControlName="serviceId">
            <option value="" disabled selected>აირჩიეთ სერვისი</option>
            <option *ngFor="let s of services" [value]="s.id">{{ s.name }} - {{ s.price }} ₾</option>
          </select>
        </div>

        <div class="form-group">
          <label for="barberId">ბარბერი</label>
          <select id="barberId" formControlName="barberId">
            <option value="" disabled selected>აირჩიეთ ბარბერი</option>
            <option *ngFor="let b of barbers" [value]="b.id">{{ b.name }} ({{ b.role }})</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">თარიღი</label>
          <input type="date" id="date" formControlName="date">
        </div>

        <div class="form-group">
          <label for="time">დრო</label>
          <input type="time" id="time" formControlName="time">
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="bookingForm.invalid">
        📲 ჯავშანი WhatsApp-ით
      </button>
    </form>
  </div>
</section>
